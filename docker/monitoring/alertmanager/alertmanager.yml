global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'job']
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h
  receiver: default-receiver

receivers:
  - name: default-receiver
    webhook_configs:
      - url: 'http://host.docker.internal:8080/actuator/health'
        send_resolved: true

