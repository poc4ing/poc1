spring:
  kafka:
    bootstrap-servers: events.kyoe.es:9092
    properties:
      security.protocol: PLAINTEXT
      sasl.mechanism: ""
      sasl.jaas.config: ""
      session.timeout.ms: 45000
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
        max.block.ms: 3000

client:
  id: ccloud-springboot-client-85234916-9a84-4989-8815-2d19f6946ac0

sc:
  pulse:
    switches-events: sc.pulse.switches-events
